[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftdocket"
version = "0.1.0"
description = "Evidence-backed drift monitoring and retraining decisions"
requires-python = ">=3.11"

[project.scripts]
driftdocket = "driftdocket.cli:main"

[tool.setuptools.packages.find]
include = ["driftdocket*"]
